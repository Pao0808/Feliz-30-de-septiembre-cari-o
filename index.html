<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Universo ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01030a;
    font-family:Arial, sans-serif;
    color:white;
    touch-action:none;
}

/* =========================
   UNIVERSO
========================= */

body{
    background:
        radial-gradient(circle at 50% 50%, #071b35 0%, #020713 35%, #010208 75%);
}

.space{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Nebulosas */

.nebula{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.28;
    pointer-events:none;
}

.nebula.one{
    width:450px;
    height:300px;
    background:#0066ff;
    left:-150px;
    top:10%;
}

.nebula.two{
    width:500px;
    height:350px;
    background:#174cff;
    right:-180px;
    bottom:5%;
}

.nebula.three{
    width:300px;
    height:300px;
    background:#008cff;
    left:35%;
    top:35%;
    opacity:.12;
}

/* =========================
   ESTRELLAS
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 7px #5aa9ff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2; transform:scale(.7);}
    to{opacity:1; transform:scale(1.5);}
}

/* =========================
   TITULO
========================= */

.title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    text-align:center;
    width:100%;
    pointer-events:none;
}

.title h1{
    font-size:clamp(22px,5vw,42px);
    letter-spacing:6px;
    text-shadow:
        0 0 10px #168cff,
        0 0 25px #006cff;
}

.title p{
    margin-top:5px;
    color:#9acbff;
    font-size:12px;
    letter-spacing:2px;
}

/* =========================
   UNIVERSO 3D
========================= */

.universe{
    position:absolute;
    width:100%;
    height:100%;
    perspective:1100px;
}

.world{
    position:absolute;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform .12s ease-out;
}

/* =========================
   MOTOS
========================= */

.motorcycle{
    position:absolute;
    width:clamp(115px,17vw,230px);
    cursor:pointer;
    transform-style:preserve-3d;
    transition:
        transform .35s ease,
        filter .35s ease,
        opacity .35s ease;
    user-select:none;
    -webkit-user-drag:none;
}

.motorcycle img{
    width:100%;
    display:block;
    object-fit:contain;
    filter:
        drop-shadow(0 0 8px rgba(0,130,255,.55))
        drop-shadow(0 0 22px rgba(0,100,255,.25));
    transition:filter .3s ease;
    pointer-events:none;
}

.motorcycle:hover img{
    filter:
        drop-shadow(0 0 12px rgba(50,160,255,.9))
        drop-shadow(0 0 35px rgba(0,100,255,.7));
}

/* MOTO ESPECIAL */

.motorcycle.special{
    width:clamp(150px,22vw,290px);
    z-index:20;
}

.motorcycle.special img{
    filter:
        drop-shadow(0 0 10px #168cff)
        drop-shadow(0 0 30px #0066ff)
        drop-shadow(0 0 55px rgba(0,130,255,.55));
}

/* =========================
   RAMO CENTRAL
========================= */

.bouquet{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:clamp(180px,25vw,310px);
    z-index:50;
    cursor:pointer;
    animation:bloom 4s ease-in-out infinite;
}

.bouquet img{
    width:100%;
    display:block;
    filter:
        drop-shadow(0 0 12px #168cff)
        drop-shadow(0 0 35px rgba(0,110,255,.75));
}

@keyframes bloom{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.035);}
}

/* =========================
   INSTRUCCIÓN
========================= */

.instruction{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    color:#8fc8ff;
    font-size:11px;
    letter-spacing:2px;
    text-align:center;
    text-shadow:0 0 8px #168cff;
    pointer-events:none;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,8,.78);
    backdrop-filter:blur(10px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(90%,450px);
    background:
        linear-gradient(145deg,
        rgba(5,20,42,.97),
        rgba(1,5,15,.98));
    border:1px solid #168cff;
    border-radius:22px;
    padding:30px 25px;
    text-align:center;
    box-shadow:
        0 0 20px rgba(0,120,255,.7),
        inset 0 0 30px rgba(0,90,255,.12);
    animation:modalIn .35s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.8) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal-box h2{
    color:#62b7ff;
    font-size:25px;
    margin-bottom:7px;
    text-shadow:0 0 12px #168cff;
}

.modal-box h3{
    color:white;
    margin-bottom:20px;
    font-size:17px;
}

.modal-box p{
    line-height:1.7;
    color:#d9eaff;
    font-size:15px;
}

.close{
    margin-top:25px;
    border:1px solid #168cff;
    background:#06152b;
    color:#9bd2ff;
    padding:10px 25px;
    border-radius:30px;
    cursor:pointer;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .title{
        top:12px;
    }

    .title h1{
        letter-spacing:3px;
    }

    .title p{
        font-size:9px;
    }

    .instruction{
        bottom:12px;
        font-size:8px;
    }

    .motorcycle{
        width:115px;
    }

    .motorcycle.special{
        width:150px;
    }

    .bouquet{
        width:180px;
    }
}
</style>
</head>

<body>

<div class="space">

    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>

    <div class="stars" id="stars"></div>

    <div class="title">
        <h1>NUESTRO UNIVERSO</h1>
        <p>Un pequeño lugar hecho para ti ❤️</p>
    </div>

    <div class="universe" id="universe">

        <div class="world" id="world">

            <!-- =====================
                 RAMO CENTRAL
            ====================== -->

            <div class="bouquet" onclick="openBouquet()">
                <img src="ramo.png" alt="Nuestro ramo">
            </div>


            <!-- =====================
                 MOTOS
            ====================== -->

            <div class="motorcycle"
                 style="left:4%;top:20%;transform:translateZ(100px) rotate(-8deg)"
                 onclick="openBike('CFMOTO','675SR-R','Una de tus motos soñadas ❤️')">

                <img src="motos/cf moto 675.png">
            </div>


            <div class="motorcycle"
                 style="left:70%;top:15%;transform:translateZ(-250px) rotate(7deg)"
                 onclick="openBike('CFMOTO','750SR-R','Otra de esas motos que algún día quiero verte conducir ❤️')">

                <img src="motos/cf moto 750.png">
            </div>


            <div class="motorcycle"
                 style="left:18%;top:62%;transform:translateZ(-180px) rotate(-5deg)"
                 onclick="openBike('Honda','CBR500R','Una de tus motos soñadas. Y yo quiero estar ahí para verte cumplir tus sueños.')">

                <img src="motos/cbr500r.png">
            </div>


            <div class="motorcycle"
                 style="left:76%;top:65%;transform:translateZ(180px) rotate(8deg)"
                 onclick="openBike('Honda','NX500 E-Clutch','Una aventura más que algún día podremos compartir ❤️')">

                <img src="motos/nx500.png">
            </div>


            <div class="motorcycle"
                 style="left:3%;top:43%;transform:translateZ(-350px) rotate(-12deg)"
                 onclick="openBike('Kawasaki','Ninja 300 ABS','Una de tus motos soñadas 🖤💙')">

                <img src="motos/ninja300.png">
            </div>


            <div class="motorcycle"
                 style="left:82%;top:40%;transform:translateZ(-100px) rotate(10deg)"
                 onclick="openBike('Kawasaki','Ninja 500 SE ABS','Una de esas máquinas que hacen brillar tus ojos.')">

                <img src="motos/ninja500.png">
            </div>


            <div class="motorcycle"
                 style="left:42%;top:9%;transform:translateZ(-300px) rotate(-3deg)"
                 onclick="openBike('Yamaha','R3','Pequeña, deportiva y hermosa… como una de tus grandes ilusiones.')">

                <img src="motos/r3.png">
            </div>


            <!-- MOTO ESPECIAL -->

            <div class="motorcycle special"
                 style="left:42%;top:73%;transform:translateZ(300px)"
                 onclick="openBike('Honda','CB190R','❤️ La moto especial de tu universo. La que ya forma parte de tu historia.')">

                <img src="motos/cb190r.png">
            </div>


            <div class="motorcycle"
                 style="left:27%;top:16%;transform:translateZ(250px) rotate(-5deg)"
                 onclick="openBike('Yamaha','YZF-R1','Porque incluso las máquinas más increíbles tienen un lugar en este universo.')">

                <img src="motos/r1.png">
            </div>


            <div class="motorcycle"
                 style="left:58%;top:24%;transform:translateZ(150px) rotate(6deg)"
                 onclick="openBike('Kawasaki','Ninja ZX-6R','Otra joya dentro de nuestro pequeño universo.')">

                <img src="motos/zx6r.png">
            </div>


            <div class="motorcycle"
                 style="left:25%;top:42%;transform:translateZ(-250px) rotate(-7deg)"
                 onclick="openBike('Suzuki','GSX-R1000','Una máquina que merece su propio lugar entre las estrellas.')">

                <img src="motos/gsxr1000.png">
            </div>


            <div class="motorcycle"
                 style="left:63%;top:47%;transform:translateZ(-350px) rotate(8deg)"
                 onclick="openBike('BMW','S 1000 RR','Una de esas motos que simplemente no pueden pasar desapercibidas.')">

                <img src="motos/s1000rr.png">
            </div>


            <div class="motorcycle"
                 style="left:8%;top:73%;transform:translateZ(50px) rotate(-6deg)"
                 onclick="openBike('Ducati','Panigale V4','Potencia, velocidad y belleza en una sola máquina.')">

                <img src="motos/panigale.png">
            </div>


            <div class="motorcycle"
                 style="left:70%;top:76%;transform:translateZ(-250px) rotate(5deg)"
                 onclick="openBike('Honda','CBR1000RR-R Fireblade','Otra de las máquinas que podrían vivir perfectamente en este universo.')">

                <img src="motos/fireblade.png">
            </div>


            <div class="motorcycle"
                 style="left:48%;top:55%;transform:translateZ(-400px) rotate(-4deg)"
                 onclick="openBike('Aprilia','RSV4','Y todavía quedan muchas máquinas por descubrir…')">

                <img src="motos/rsv4.png">
            </div>

        </div>
    </div>

    <div class="instruction">
        ✦ DESLIZA PARA VIAJAR POR NUESTRO UNIVERSO ✦
    </div>
</div>


<!-- =====================
     MODAL
====================== -->

<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="modalBrand"></h2>
        <h3 id="modalModel"></h3>

        <p id="modalText"></p>

        <button class="close" onclick="closeModal()">
            CERRAR ❤️
        </button>

    </div>

</div>


<script>

/* =========================
   ESTRELLAS
========================= */

const stars = document.getElementById("stars");

for(let i=0;i<180;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=(Math.random()*3)+"s";

    const size=Math.random()*2+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    stars.appendChild(star);
}


/* =========================
   ROTACIÓN DEL UNIVERSO
========================= */

const world=document.getElementById("world");

let rotationX=0;
let rotationY=0;

let dragging=false;
let startX=0;
let startY=0;

let lastX=0;
let lastY=0;


/* TOUCH / MOUSE */

document.addEventListener("pointerdown",(e)=>{

    if(e.target.closest(".motorcycle") || e.target.closest(".bouquet")){
        return;
    }

    dragging=true;

    startX=e.clientX;
    startY=e.clientY;

    lastX=e.clientX;
    lastY=e.clientY;
});


document.addEventListener("pointermove",(e)=>{

    if(!dragging)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    rotationY += dx*.35;
    rotationX -= dy*.18;

    rotationX=Math.max(-30,Math.min(30,rotationX));

    world.style.transform=
        `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

    lastX=e.clientX;
    lastY=e.clientY;
});


document.addEventListener("pointerup",()=>{
    dragging=false;
});

document.addEventListener("pointercancel",()=>{
    dragging=false;
});


/* =========================
   MODAL MOTO
========================= */

function openBike(brand,model,message){

    document.getElementById("modalBrand").textContent=brand;

    document.getElementById("modalModel").textContent=model;

    document.getElementById("modalText").textContent=message;

    document.getElementById("modal").classList.add("active");
}


function openBouquet(){

    document.getElementById("modalBrand").textContent="PARA TI ❤️";

    document.getElementById("modalModel").textContent="Nuestro pequeño universo";

    document.getElementById("modalText").textContent=
    "Entre todas las motos, las estrellas y todo este universo, hay algo que siempre va a estar en el centro: tú. Este ramo representa todo el cariño que puse en este pequeño lugar solamente para ti. ❤️";

    document.getElementById("modal").classList.add("active");
}


function closeModal(){

    document.getElementById("modal").classList.remove("active");
}


/* CERRAR TOCANDO AFUERA */

document.getElementById("modal").addEventListener("click",(e)=>{

    if(e.target.id==="modal"){
        closeModal();
    }

});

</script>

</body>
</html>
