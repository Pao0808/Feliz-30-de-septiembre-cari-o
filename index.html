<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nuestro Universo 💙</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010208;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    touch-action:none;
}

/* =========================
   UNIVERSO
========================= */

#universe{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%, rgba(0,90,255,.15), transparent 25%),
        radial-gradient(circle at 20% 30%, rgba(0,80,255,.12), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(30,0,150,.15), transparent 30%),
        #010208;
}

/* nebulosas */

.nebula{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    pointer-events:none;
    opacity:.35;
}

.nebula.one{
    width:45vw;
    height:45vw;
    background:#063bff;
    left:-20vw;
    top:10vh;
}

.nebula.two{
    width:40vw;
    height:40vw;
    background:#3010b8;
    right:-20vw;
    bottom:0;
}

.nebula.three{
    width:35vw;
    height:35vw;
    background:#0066ff;
    left:35%;
    bottom:-20%;
}

/* =========================
   ESTRELLAS
========================= */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px rgba(100,180,255,.9);
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.25; transform:scale(.7);}
    to{opacity:1; transform:scale(1.5);}
}

/* =========================
   TITULO
========================= */

.title{
    position:absolute;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:20;
    pointer-events:none;
}

.title h1{
    font-size:clamp(25px,5vw,48px);
    letter-spacing:7px;
    color:white;
    text-shadow:
        0 0 8px #268cff,
        0 0 25px rgba(0,100,255,.7);
}

.title p{
    margin-top:8px;
    font-size:clamp(10px,2vw,15px);
    letter-spacing:3px;
    color:#8bbdff;
}

/* =========================
   UNIVERSO 3D
========================= */

#space{
    position:absolute;
    left:50%;
    top:50%;
    width:min(95vw,900px);
    height:min(95vw,900px);
    transform:translate(-50%,-50%);
    perspective:1000px;
    transform-style:preserve-3d;
}

/* =========================
   RAMO CENTRAL
========================= */

#bouquet{
    position:absolute;
    left:50%;
    top:50%;
    width:170px;
    height:230px;
    transform:translate(-50%,-42%);
    z-index:50;
    cursor:pointer;
}

.stems{
    position:absolute;
    bottom:15px;
    left:50%;
    width:100%;
    height:150px;
}

.stem{
    position:absolute;
    width:4px;
    height:140px;
    background:linear-gradient(#287eff,#0648a8);
    left:50%;
    bottom:0;
    transform-origin:bottom;
    box-shadow:0 0 8px rgba(0,100,255,.6);
}

.stem:nth-child(1){transform:rotate(-28deg);}
.stem:nth-child(2){transform:rotate(-14deg);}
.stem:nth-child(3){transform:rotate(0deg);}
.stem:nth-child(4){transform:rotate(14deg);}
.stem:nth-child(5){transform:rotate(28deg);}

.flower{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    background:
        radial-gradient(circle,
        #d7efff 0 7%,
        #4da4ff 8% 22%,
        #0874ff 23% 45%,
        #063cbd 46% 65%,
        transparent 66%);
    filter:drop-shadow(0 0 12px #0874ff);
    animation:flowerGlow 3s infinite alternate;
}

.flower:nth-child(1){left:12px;top:35px;}
.flower:nth-child(2){left:48px;top:5px;}
.flower:nth-child(3){left:80px;top:30px;}
.flower:nth-child(4){left:32px;top:65px;}
.flower:nth-child(5){left:72px;top:70px;}

@keyframes flowerGlow{
    from{filter:drop-shadow(0 0 7px #0874ff);}
    to{filter:drop-shadow(0 0 20px #3ea5ff);}
}

.ribbon{
    position:absolute;
    left:50%;
    bottom:5px;
    transform:translateX(-50%);
    width:65px;
    height:28px;
    background:linear-gradient(90deg,#04338e,#178cff,#04338e);
    border-radius:8px;
    box-shadow:0 0 15px #086eff;
}

/* =========================
   MOTOS
========================= */

#bikes{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
}

.bike{
    position:absolute;
    left:50%;
    top:50%;
    width:135px;
    height:70px;
    transform-style:preserve-3d;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:
        transform .45s ease,
        opacity .45s ease,
        filter .45s ease;
}

.bike-body{
    position:absolute;
    left:25px;
    top:25px;
    width:82px;
    height:22px;
    background:linear-gradient(135deg,#101a2b,#287dff,#071329);
    border-radius:45% 35% 20% 20%;
    transform:skewX(-18deg);
    box-shadow:
        0 0 8px rgba(20,130,255,.9),
        inset 0 0 7px rgba(255,255,255,.2);
}

.bike-body::after{
    content:"";
    position:absolute;
    right:-15px;
    top:2px;
    width:22px;
    height:13px;
    background:#1b69e8;
    border-radius:0 60% 20% 0;
}

.wheel{
    position:absolute;
    width:29px;
    height:29px;
    border:4px solid #10131b;
    border-radius:50%;
    background:#02040a;
    box-shadow:
        0 0 0 2px #526070,
        0 0 8px rgba(0,120,255,.6);
}

.wheel.left{
    left:18px;
    top:43px;
}

.wheel.right{
    right:18px;
    top:43px;
}

.wheel::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#67b4ff;
    left:7px;
    top:7px;
}

.handle{
    position:absolute;
    right:20px;
    top:17px;
    width:22px;
    height:3px;
    background:#9ab9dc;
    transform:rotate(-15deg);
}

.seat{
    position:absolute;
    left:55px;
    top:18px;
    width:32px;
    height:7px;
    background:#111820;
    border-radius:8px;
}

.light{
    position:absolute;
    right:7px;
    top:29px;
    width:8px;
    height:7px;
    border-radius:50%;
    background:#bce7ff;
    box-shadow:0 0 12px #4db2ff;
}

/* moto especial */

.bike.special .bike-body{
    background:linear-gradient(135deg,#070a10,#e21d2f,#080d18);
    box-shadow:
        0 0 10px #ff263d,
        0 0 25px rgba(0,120,255,.8);
}

.bike.special::before{
    content:"♥";
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    color:#67b9ff;
    text-shadow:0 0 12px #1688ff;
    font-size:17px;
}

/* =========================
   NOMBRE DE MOTO
========================= */

.bike-name{
    position:absolute;
    left:50%;
    top:82px;
    transform:translateX(-50%);
    width:180px;
    text-align:center;
    font-size:9px;
    letter-spacing:1px;
    color:#b9d9ff;
    text-shadow:0 0 8px #0874ff;
    pointer-events:none;
    white-space:nowrap;
}

/* =========================
   INSTRUCCION
========================= */

.instructions{
    position:absolute;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    text-align:center;
    color:#8dbfff;
    font-size:clamp(9px,2vw,13px);
    letter-spacing:2px;
    white-space:nowrap;
    pointer-events:none;
}

.instructions strong{
    color:white;
}

/* =========================
   MODAL
========================= */

#modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,10,.75);
    backdrop-filter:blur(8px);
    padding:25px;
}

#modal.show{
    display:flex;
}

.modal-box{
    width:min(430px,92vw);
    padding:30px 24px;
    text-align:center;
    border:1px solid #258cff;
    border-radius:22px;
    background:
        radial-gradient(circle at 50% 0%,rgba(0,120,255,.25),transparent 55%),
        linear-gradient(145deg,#030816,#07152d);
    box-shadow:
        0 0 20px rgba(0,110,255,.7),
        0 0 70px rgba(0,60,255,.25);
    animation:modalIn .4s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.8) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal-box .small{
    color:#64b1ff;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:10px;
}

.modal-box h2{
    font-size:25px;
    margin-bottom:15px;
    color:white;
    text-shadow:0 0 12px #1688ff;
}

.modal-box p{
    color:#d8e9ff;
    line-height:1.7;
    font-size:15px;
}

.close{
    margin-top:22px;
    padding:10px 24px;
    border:1px solid #258cff;
    border-radius:30px;
    color:white;
    background:rgba(0,100,255,.15);
    cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .title{
        top:4%;
    }

    .title h1{
        letter-spacing:4px;
    }

    #space{
        width:100vw;
        height:100vw;
        max-width:none;
        max-height:none;
    }

    #bouquet{
        transform:translate(-50%,-45%) scale(.8);
    }

    .bike{
        width:115px;
        height:62px;
    }

    .bike-name{
        font-size:8px;
        top:72px;
    }

    .instructions{
        bottom:4%;
        letter-spacing:1.2px;
    }
}
</style>
</head>

<body>

<div id="universe">

    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>

    <div class="stars" id="stars"></div>

    <div class="title">
        <h1>NUESTRO UNIVERSO</h1>
        <p>un pequeño universo hecho para ti 💙</p>
    </div>

    <div id="space">

        <!-- RAMO -->
        <div id="bouquet">

            <div class="flower"></div>
            <div class="flower"></div>
            <div class="flower"></div>
            <div class="flower"></div>
            <div class="flower"></div>

            <div class="stems">
                <div class="stem"></div>
                <div class="stem"></div>
                <div class="stem"></div>
                <div class="stem"></div>
                <div class="stem"></div>
            </div>

            <div class="ribbon"></div>

        </div>

        <!-- MOTOS -->
        <div id="bikes"></div>

    </div>

    <div class="instructions">
        <strong>← DESLIZA →</strong> PARA GIRAR NUESTRO UNIVERSO
    </div>

</div>

<!-- MODAL -->
<div id="modal">

    <div class="modal-box">

        <div class="small" id="modalSmall">
            UNA ESTRELLA DE TU UNIVERSO
        </div>

        <h2 id="modalTitle"></h2>

        <p id="modalMessage"></p>

        <button class="close" id="closeModal">
            CERRAR 💙
        </button>

    </div>

</div>

<script>

/* =========================================
   ESTRELLAS
========================================= */

const starsContainer = document.getElementById("stars");

for(let i = 0; i < 180; i++){

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 2 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay = Math.random() * 3 + "s";

    starsContainer.appendChild(star);
}


/* =========================================
   DATOS DE LAS 15 MOTOS
========================================= */

const bikesData = [

    {
        name:"CFMOTO 675SR-R",
        dream:true,
        message:"Uno de esos sueños que algún día quiero verte cumplir. 💙"
    },

    {
        name:"CFMOTO 750SR-R",
        dream:true,
        message:"Porque sé que cuando algo te gusta, tus ojos brillan de una manera diferente. ✨"
    },

    {
        name:"Honda CBR500R",
        dream:true,
        message:"Una de esas motos que espero algún día ver contigo. 🏍️💙"
    },

    {
        name:"Honda NX500 E-Clutch",
        dream:true,
        message:"Otro de esos sueños que quiero ver convertirse en realidad para ti."
    },

    {
        name:"Kawasaki Ninja 300 ABS",
        dream:true,
        message:"Porque también hay sueños pequeños que pueden hacer muy feliz a alguien. 💚"
    },

    {
        name:"Kawasaki Ninja 500 SE ABS",
        dream:true,
        message:"Una más de las motos que forman parte de esa lista que tanto te gusta. 🏍️"
    },

    {
        name:"Yamaha R3",
        dream:true,
        message:"Y porque sé que esta también ocupa un pequeño espacio en tus sueños. 💙"
    },

    {
        name:"Honda CB190R",
        special:true,
        message:"De todas las motos de este universo, esta es diferente... porque esta ya forma parte de tu historia. ❤️"
    },

    {
        name:"Yamaha YZF-R1",
        message:"Hay motos increíbles por todo el universo... y esta es una de ellas. ✨"
    },

    {
        name:"Kawasaki Ninja ZX-6R",
        message:"Una pequeña estrella verde perdida entre nuestro universo azul. 💚"
    },

    {
        name:"Suzuki GSX-R1000",
        message:"Porque los sueños también pueden tener ruedas. 🏍️"
    },

    {
        name:"BMW S 1000 RR",
        message:"Otra máquina para llenar este pequeño universo de velocidad. ✨"
    },

    {
        name:"Ducati Panigale V4",
        message:"Una belleza más viajando por este universo que hice para ti."
    },

    {
        name:"Honda CBR1000RR-R Fireblade",
        message:"Porque un universo de motos nunca estaría completo sin una Fireblade. 🔥"
    },

    {
        name:"Aprilia RSV4",
        message:"Una última estrella para acompañar todas las demás. 💙"
    }

];


/* =========================================
   CREAR MOTOS
========================================= */

const bikesContainer = document.getElementById("bikes");

const bikeElements = [];

bikesData.forEach((data,index)=>{

    const bike = document.createElement("div");

    bike.className = "bike";

    if(data.special){
        bike.classList.add("special");
    }

    bike.dataset.index = index;

    bike.innerHTML = `
        <div class="bike-body"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
        <div class="seat"></div>
        <div class="handle"></div>
        <div class="light"></div>
        <div class="bike-name">${data.name}</div>
    `;

    bikesContainer.appendChild(bike);

    bikeElements.push(bike);

});


/* =========================================
   POSICIONES 3D
========================================= */

/*
   Cada moto tiene una posición dentro de
   una esfera imaginaria.

   No están formando una fila.
*/

const positions = [

    [-300,-180,120],
    [-110,-270,-40],
    [130,-240,90],
    [310,-130,-100],
    [-350,10,-70],
    [-160,40,150],
    [170,10,-130],
    [340,100,130],
    [-300,190,100],
    [-100,240,-80],
    [120,210,140],
    [300,220,-120],
    [-210,-80,-180],
    [30,-110,210],
    [210,80,-210]

];


/* =========================================
   ESTADO DE ROTACIÓN
========================================= */

let rotationX = 0;
let rotationY = 0;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let dragging = false;

let moved = false;

let selectedBike = null;


/* =========================================
   RENDER DEL UNIVERSO
========================================= */

function renderUniverse(){

    bikeElements.forEach((bike,i)=>{

        const original = positions[i];

        let x = original[0];
        let y = original[1];
        let z = original[2];

        /*
          Rotación alrededor del eje Y
        */

        const ry = rotationY * Math.PI / 180;

        let x1 = x * Math.cos(ry) - z * Math.sin(ry);
        let z1 = x * Math.sin(ry) + z * Math.cos(ry);

        /*
          Rotación alrededor del eje X
        */

        const rx = rotationX * Math.PI / 180;

        let y1 = y * Math.cos(rx) - z1 * Math.sin(rx);
        let z2 = y * Math.sin(rx) + z1 * Math.cos(rx);

        /*
          Profundidad
        */

        const depth = (z2 + 300) / 600;

        const scale = .55 + depth * .8;

        const opacity = .35 + depth * .65;

        /*
          Las motos que están delante
          aparecen por encima del resto.
        */

        const zIndex = Math.round((z2 + 500) + 10);

        bike.style.transform = `
            translate3d(
                calc(-50% + ${x1}px),
                calc(-50% + ${y1}px),
                ${z2}px
            )
            scale(${scale})
        `;

        bike.style.opacity = opacity;

        bike.style.zIndex = zIndex;

        /*
          Motos lejanas:
          menos brillo.
        */

        bike.style.filter =
            `brightness(${.55 + depth*.65})`;

    });

}


/* =========================================
   ROTACIÓN CON EL DEDO
========================================= */

const space = document.getElementById("space");

space.addEventListener("pointerdown",(e)=>{

    /*
      Si tocamos una moto,
      dejamos que el sistema determine
      si fue un toque o un movimiento.
    */

    dragging = true;
    moved = false;

    startX = e.clientX;
    startY = e.clientY;

    lastX = e.clientX;
    lastY = e.clientY;

    space.setPointerCapture(e.pointerId);

});


space.addEventListener("pointermove",(e)=>{

    if(!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    if(Math.abs(e.clientX - startX) > 8 ||
       Math.abs(e.clientY - startY) > 8){

        moved = true;

    }

    /*
      Movimiento horizontal:
      gira el universo.

      Movimiento vertical:
      cambia ligeramente la inclinación.
    */

    rotationY += dx * .35;

    rotationX -= dy * .20;

    /*
      Evitamos que la inclinación
      sea exagerada.
    */

    rotationX = Math.max(-55,Math.min(55,rotationX));

    lastX = e.clientX;
    lastY = e.clientY;

    renderUniverse();

});


space.addEventListener("pointerup",(e)=>{

    dragging = false;

    /*
      Si apenas tocamos una moto
      y no la arrastramos,
      abrimos su mensaje.
    */

    if(!moved){

        const targetBike = e.target.closest(".bike");

        if(targetBike){

            openBikeModal(
                Number(targetBike.dataset.index)
            );

        }

    }

});


space.addEventListener("pointercancel",()=>{

    dragging = false;

});


/* =========================================
   MODAL DE MOTO
========================================= */

const modal = document.getElementById("modal");

const modalTitle = document.getElementById("modalTitle");

const modalMessage = document.getElementById("modalMessage");

const modalSmall = document.getElementById("modalSmall");


function openBikeModal(index){

    const data = bikesData[index];

    modalTitle.textContent = data.name;

    modalMessage.textContent = data.message;

    if(data.special){

        modalSmall.textContent =
            "❤️ LA MOTO ESPECIAL DE TU UNIVERSO";

    }else if(data.dream){

        modalSmall.textContent =
            "⭐ UNA DE TUS MOTOS SOÑADAS";

    }else{

        modalSmall.textContent =
            "✦ UNA ESTRELLA DE NUESTRO UNIVERSO";

    }

    modal.classList.add("show");

}


document.getElementById("closeModal")
    .addEventListener("click",()=>{

        modal.classList.remove("show");

    });


modal.addEventListener("click",(e)=>{

    if(e.target === modal){

        modal.classList.remove("show");

    }

});


/* =========================================
   RAMO
========================================= */

document.getElementById("bouquet")
    .addEventListener("pointerup",(e)=>{

        if(moved) return;

        modalSmall.textContent = "PARA TI 💙";

        modalTitle.textContent =
            "Mi lugar favorito";

        modalMessage.textContent =
            "Entre todas las estrellas, todas las motos y todos los lugares de este universo, siempre habrá un pequeño espacio que hice especialmente para ti. Gracias por formar parte de mi vida. 💙";

        modal.classList.add("show");

    });


/* =========================================
   INICIAR
========================================= */

renderUniverse();


/* =========================================
   PEQUEÑO MOVIMIENTO AUTOMÁTICO
========================================= */

let autoRotation = true;

function gentleMotion(){

    if(!dragging && !modal.classList.contains("show")){

        rotationY += .015;

        renderUniverse();

    }

    requestAnimationFrame(gentleMotion);

}

gentleMotion();

</script>

</body>
</html>
