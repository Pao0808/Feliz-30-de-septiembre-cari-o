<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Universo 💙</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #010208;
    color: white;
}

body {
    position: relative;
}

/* =========================
   UNIVERSO
========================= */

.universe {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center,
            rgba(10, 43, 88, 0.45) 0%,
            rgba(2, 12, 28, 0.45) 28%,
            #010208 70%
        );
}

/* Nebulosa azul */

.nebula {
    position: absolute;
    width: 80vw;
    height: 80vw;
    max-width: 850px;
    max-height: 850px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(
            ellipse,
            rgba(0, 119, 255, 0.16) 0%,
            rgba(0, 67, 150, 0.08) 35%,
            transparent 70%
        );
    filter: blur(25px);
    animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
    0%,100% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: .65;
    }

    50% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 1;
    }
}

/* =========================
   ESTRELLAS
========================= */

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
}

.stars {
    background-image:
        radial-gradient(circle, white 1px, transparent 1.5px),
        radial-gradient(circle, rgba(110,190,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.7) .8px, transparent 1.3px);
    background-size: 170px 170px, 230px 230px, 310px 310px;
    background-position: 20px 30px, 90px 110px, 40px 170px;
    opacity: .55;
    animation: starsMove 25s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-170px);
    }
}

/* =========================
   DESTELLOS
========================= */

.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #9bd8ff;
    border-radius: 50%;
    box-shadow:
        0 0 7px #58baff,
        0 0 15px #087cff;
    animation: twinkle 3s infinite ease-in-out;
}

.spark:nth-child(1) { left: 12%; top: 18%; animation-delay: .3s; }
.spark:nth-child(2) { left: 83%; top: 20%; animation-delay: 1.1s; }
.spark:nth-child(3) { left: 20%; top: 73%; animation-delay: 1.8s; }
.spark:nth-child(4) { left: 88%; top: 70%; animation-delay: .7s; }
.spark:nth-child(5) { left: 48%; top: 12%; animation-delay: 2.2s; }
.spark:nth-child(6) { left: 67%; top: 85%; animation-delay: 1.5s; }

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.7);
    }
    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================
   TITULO
========================= */

.title {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    width: 90%;
    animation: appear 2s ease forwards;
}

.title h1 {
    font-size: clamp(25px, 5vw, 48px);
    font-weight: normal;
    letter-spacing: 4px;
    color: #d9efff;
    text-shadow:
        0 0 10px rgba(72,174,255,.8),
        0 0 30px rgba(0,100,255,.5);
}

.title p {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(180,220,255,.65);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translate(-50%, -15px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

/* =========================
   RAMO CENTRAL
========================= */

.bouquet {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    width: min(260px, 55vw);
    height: min(310px, 60vh);
    z-index: 8;
    cursor: pointer;
    animation: bouquetFloat 5s ease-in-out infinite;
}

@keyframes bouquetFloat {
    0%,100% {
        transform: translate(-50%, -50%) translateY(0);
    }
    50% {
        transform: translate(-50%, -50%) translateY(-10px);
    }
}

/* Aura */

.bouquet::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 150%;
    left: -25%;
    top: -25%;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(20,130,255,.16),
        transparent 65%
    );
    filter: blur(20px);
}

/* Tallitos */

.stem {
    position: absolute;
    width: 4px;
    height: 135px;
    background: linear-gradient(
        to bottom,
        #8dd6ff,
        #075aa7
    );
    bottom: 28px;
    left: 50%;
    transform-origin: bottom;
    border-radius: 5px;
}

.stem.one {
    transform: rotate(-18deg);
}

.stem.two {
    transform: rotate(0deg);
}

.stem.three {
    transform: rotate(18deg);
}

.stem.four {
    transform: rotate(-32deg);
}

.stem.five {
    transform: rotate(30deg);
}

/* Flores */

.flower {
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #d8f4ff 0 7%,
            #58baff 8% 17%,
            #1769d1 18% 35%,
            #073d91 36% 55%,
            transparent 56%
        );
    filter:
        drop-shadow(0 0 8px #229cff)
        drop-shadow(0 0 20px rgba(0,105,255,.7));
    animation: flowerGlow 3s ease-in-out infinite;
}

.flower::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: #d9f6ff;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px white;
}

.flower.f1 {
    left: 22%;
    top: 28%;
}

.flower.f2 {
    left: 50%;
    top: 17%;
    transform: translateX(-50%);
}

.flower.f3 {
    right: 19%;
    top: 30%;
}

.flower.f4 {
    left: 33%;
    top: 4%;
    transform: scale(.72);
}

.flower.f5 {
    right: 31%;
    top: 6%;
    transform: scale(.72);
}

@keyframes flowerGlow {
    0%,100% {
        filter:
            drop-shadow(0 0 7px #229cff)
            drop-shadow(0 0 15px rgba(0,105,255,.5));
    }

    50% {
        filter:
            drop-shadow(0 0 12px #6bc9ff)
            drop-shadow(0 0 30px rgba(0,105,255,.9));
    }
}

/* Papel del ramo */

.ribbon {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 75px;
    background: linear-gradient(
        135deg,
        rgba(28,110,185,.95),
        rgba(3,35,80,.95)
    );
    clip-path: polygon(
        12% 0,
        88% 0,
        100% 100%,
        50% 78%,
        0 100%
    );
    border: 1px solid rgba(120,210,255,.5);
    box-shadow: 0 0 20px rgba(0,120,255,.5);
}

.ribbon::after {
    content: "💙";
    position: absolute;
    left: 50%;
    top: 35%;
    transform: translate(-50%, -50%);
    font-size: 20px;
}

/* =========================
   MOTOS
========================= */

.motorcycle {
    position: absolute;
    width: 105px;
    height: 65px;
    z-index: 7;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: filter .25s ease;
    animation: motorcycleFloat 5s ease-in-out infinite;
}

.motorcycle:active {
    cursor: grabbing;
}

.motorcycle:hover {
    filter:
        drop-shadow(0 0 7px #51bdff)
        drop-shadow(0 0 18px rgba(0,130,255,.8));
}

.motorcycle .bike-body {
    position: absolute;
    left: 25px;
    top: 25px;
    width: 60px;
    height: 20px;
    background: linear-gradient(
        135deg,
        #d9e5ef,
        #4d6275,
        #101923
    );
    clip-path: polygon(
        0 70%,
        20% 25%,
        45% 0,
        70% 25%,
        100% 40%,
        90% 75%,
        55% 100%,
        20% 85%
    );
}

.motorcycle .bike-body::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 8px;
    background: #168dff;
    left: 21px;
    top: 5px;
    border-radius: 50%;
    box-shadow: 0 0 9px #168dff;
}

.wheel {
    position: absolute;
    width: 25px;
    height: 25px;
    border: 4px solid #111820;
    border-radius: 50%;
    background: #02050a;
    box-shadow: inset 0 0 0 2px #657585;
}

.wheel.one {
    left: 12px;
    top: 35px;
}

.wheel.two {
    right: 8px;
    top: 35px;
}

.handle {
    position: absolute;
    width: 20px;
    height: 4px;
    background: #899baa;
    right: 8px;
    top: 21px;
    transform: rotate(-15deg);
}

.headlight {
    position: absolute;
    right: 1px;
    top: 27px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 6px white,
        0 0 15px #48baff;
}

@keyframes motorcycleFloat {
    0%,100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-12px) rotate(1deg);
    }
}

/* Posiciones */

.bike1 {
    left: 8%;
    top: 29%;
}

.bike2 {
    right: 8%;
    top: 32%;
    animation-delay: 1s;
}

.bike3 {
    left: 10%;
    bottom: 18%;
    animation-delay: 1.8s;
}

.bike4 {
    right: 10%;
    bottom: 19%;
    animation-delay: .7s;
}

/* Moto especial */

.special {
    width: 125px;
    height: 75px;
    z-index: 9;
}

.special .bike-body {
    width: 75px;
    height: 25px;
    left: 28px;
    top: 27px;
    background: linear-gradient(
        135deg,
        #f2f5f8,
        #a8b5c2,
        #222c35
    );
}

.special .bike-body::after {
    background: #d71920;
    box-shadow:
        0 0 8px #ff3c45,
        0 0 18px rgba(255,0,20,.8);
}

.special .wheel {
    width: 29px;
    height: 29px;
}

.special .wheel.one {
    left: 12px;
    top: 39px;
}

.special .wheel.two {
    right: 7px;
    top: 39px;
}

.special::before {
    content: "CB190R";
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: #9edcff;
    opacity: .9;
    white-space: nowrap;
    text-shadow: 0 0 10px #168dff;
}

.special {
    right: 50%;
    bottom: 7%;
    transform: translateX(50%);
    animation-delay: 1.4s;
}

/* =========================
   INDICACIÓN
========================= */

.instruction {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(180,220,255,.55);
    z-index: 20;
}

.instruction span {
    color: #71c8ff;
}

/* =========================
   VENTANA DE INFORMACIÓN
========================= */

.info {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.85);
    width: min(360px, 86vw);
    padding: 28px 24px;
    background:
        linear-gradient(
            145deg,
            rgba(7,25,50,.97),
            rgba(1,7,18,.98)
        );
    border: 1px solid rgba(76,183,255,.55);
    border-radius: 20px;
    box-shadow:
        0 0 30px rgba(0,100,255,.4),
        inset 0 0 30px rgba(0,100,255,.08);
    text-align: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: .35s ease;
}

.info.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.info .close {
    position: absolute;
    right: 15px;
    top: 12px;
    border: none;
    background: transparent;
    color: #a7dcff;
    font-size: 22px;
    cursor: pointer;
}

.info .icon {
    font-size: 38px;
    margin-bottom: 12px;
}

.info h2 {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 2px;
    color: #dff4ff;
}

.info h3 {
    margin-top: 5px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #55baff;
}

.info p {
    margin-top: 20px;
    line-height: 1.7;
    font-size: 14px;
    color: #d3e9f8;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .title {
        top: 4%;
    }

    .title h1 {
        font-size: 25px;
        letter-spacing: 3px;
    }

    .title p {
        font-size: 8px;
    }

    .bouquet {
        width: 220px;
        height: 280px;
        top: 53%;
    }

    .motorcycle {
        transform: scale(.78);
    }

    .bike1 {
        left: -2%;
        top: 27%;
    }

    .bike2 {
        right: -2%;
        top: 30%;
    }

    .bike3 {
        left: -1%;
        bottom: 19%;
    }

    .bike4 {
        right: -1%;
        bottom: 20%;
    }

    .special {
        right: 50%;
        bottom: 8%;
        transform: translateX(50%) scale(.9);
    }

    .instruction {
        bottom: 1.5%;
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div class="universe">

    <div class="nebula"></div>
    <div class="stars"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="title">
        <h1>NUESTRO UNIVERSO</h1>
        <p>Un pequeño lugar hecho para ti</p>
    </div>

    <!-- RAMO CENTRAL -->

    <div class="bouquet" id="bouquet">

        <div class="stem one"></div>
        <div class="stem two"></div>
        <div class="stem three"></div>
        <div class="stem four"></div>
        <div class="stem five"></div>

        <div class="flower f1"></div>
        <div class="flower f2"></div>
        <div class="flower f3"></div>
        <div class="flower f4"></div>
        <div class="flower f5"></div>

        <div class="ribbon"></div>
    </div>

    <!-- MOTOS -->

    <div class="motorcycle bike1" data-brand="YAMAHA"
         data-model="YZF-R1"
         data-message="Hay caminos que vale la pena recorrer… y personas con las que vale la pena compartirlos. 💙">
        <div class="bike-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
        <div class="handle"></div>
        <div class="headlight"></div>
    </div>

    <div class="motorcycle bike2" data-brand="KAWASAKI"
         data-model="NINJA ZX-6R"
         data-message="Algunas cosas tienen una forma especial de llamar nuestra atención. Tú eres una de ellas. ✨">
        <div class="bike-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
        <div class="handle"></div>
        <div class="headlight"></div>
    </div>

    <div class="motorcycle bike3" data-brand="SUZUKI"
         data-model="GSX-R1000"
         data-message="Que nunca te falten sueños grandes, caminos nuevos y razones para sonreír. 💙">
        <div class="bike-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
        <div class="handle"></div>
        <div class="headlight"></div>
    </div>

    <div class="motorcycle bike4" data-brand="BMW"
         data-model="S 1000 RR"
         data-message="Entre millones de personas y miles de caminos, qué bonito que nuestras historias se hayan encontrado. 🌌">
        <div class="bike-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
        <div class="handle"></div>
        <div class="headlight"></div>
    </div>

    <!-- LA MOTO DE ÉL -->

    <div class="motorcycle special"
         data-brand="HONDA"
         data-model="CB190R"
         data-message="Esta es diferente. Es la moto que forma parte de tu historia… y por eso tenía que tener un lugar especial en este universo. 💙🏍️">

        <div class="bike-body"></div>
        <div class="wheel one"></div>
        <div class="wheel two"></div>
        <div class="handle"></div>
        <div class="headlight"></div>
    </div>

    <div class="instruction">
        <span>✦</span> TOCA UNA MOTO PARA DESCUBRIR SU HISTORIA <span>✦</span>
    </div>

</div>

<!-- VENTANA -->

<div class="info" id="info">

    <button class="close" id="close">×</button>

    <div class="icon">🏍️</div>

    <h2 id="brand">HONDA</h2>

    <h3 id="model">CB190R</h3>

    <p id="message"></p>

</div>

<script>

/* =========================
   INFORMACIÓN DE LAS MOTOS
========================= */

const bikes = document.querySelectorAll(".motorcycle");
const info = document.getElementById("info");
const brand = document.getElementById("brand");
const model = document.getElementById("model");
const message = document.getElementById("message");
const close = document.getElementById("close");

let dragged = null;
let offsetX = 0;
let offsetY = 0;

bikes.forEach(bike => {

    bike.addEventListener("pointerdown", startDrag);

    bike.addEventListener("click", () => {

        if (bike.dataset.dragged === "true") {
            bike.dataset.dragged = "false";
            return;
        }

        brand.textContent = bike.dataset.brand;
        model.textContent = bike.dataset.model;
        message.textContent = bike.dataset.message;

        info.classList.add("show");
    });
});


/* =========================
   MOVER MOTOS
========================= */

function startDrag(e) {

    dragged = e.currentTarget;

    dragged.dataset.dragged = "false";

    const rect = dragged.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    dragged.style.animation = "none";

    dragged.setPointerCapture(e.pointerId);

    dragged.addEventListener("pointermove", moveDrag);
    dragged.addEventListener("pointerup", endDrag);
}

function moveDrag(e) {

    if (!dragged) return;

    const x = e.clientX - offsetX;
    const y = e.clientY - offsetY;

    if (Math.abs(e.movementX) > 1 || Math.abs(e.movementY) > 1) {
        dragged.dataset.dragged = "true";
    }

    dragged.style.left = x + "px";
    dragged.style.top = y + "px";
    dragged.style.right = "auto";
    dragged.style.bottom = "auto";
}

function endDrag() {

    if (!dragged) return;

    dragged.style.animation = "";

    dragged.removeEventListener("pointermove", moveDrag);
    dragged.removeEventListener("pointerup", endDrag);

    dragged = null;
}


/* =========================
   CERRAR INFORMACIÓN
========================= */

close.addEventListener("click", () => {
    info.classList.remove("show");
});

info.addEventListener("click", e => {

    if (e.target === info) {
        info.classList.remove("show");
    }

});


/* =========================
   RAMO
========================= */

document.getElementById("bouquet").addEventListener("click", () => {

    message.textContent =
        "Este ramo es para ti. Porque quería dejar una pequeña parte de mi cariño flotando en algún lugar del universo. 💙💐";

    brand.textContent = "PARA TI";
    model.textContent = "💙";

    info.classList.add("show");

});

</script>

</body>
</html>
